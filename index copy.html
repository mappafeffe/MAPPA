<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MAPPA</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f8f1e8;
            color: #526b5b;
            text-align: center;
        }

        h1 {
            margin-top: 40px;
            font-size: 38px;
        }

        p {
            font-size: 18px;
        }

        .area-scrittura {
            width: 80%;
            height: 300px;
            margin: 30px auto;
            background: white;
            border: 3px solid #a9b9a8;
            border-radius: 20px;
        }

        button {
            background: #d8b7b0;
            border: none;
            padding: 15px 25px;
            border-radius: 15px;
            font-size: 18px;
            color: white;
            cursor: pointer;
        }
    </style>
</head>

<body>

    <h1>🌸 MAPPA</h1>

    <p>Scrivi qui con la tua MetaPen ✏️</p>

    <canvas class="area-scrittura"></canvas>

    <br><br>

    <button>Trasforma in testo</button>

</body>
</html>
